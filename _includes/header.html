<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
            <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="SIG: Game Intelligence Logo"
                class="brand-logo" />
        </a>

        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" id="navToggle">
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
        </button>

        <nav class="nav" id="navMenu">
            {% for item in site.nav %}
            {% assign is_active = false %}
            {% if page.url == item.url or (item.url != '/' and page.url contains item.url) %}
                {% assign is_active = true %}
            {% endif %}
            <a class="nav-link{% if is_active %} active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
            {% endfor %}
        </nav>
    </div>
</header>
